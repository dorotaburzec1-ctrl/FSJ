<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziękujemy — Fundacja Świętej Jadwigi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --atrament:#14172A;--lazur:#23346B;--minia:#A8322A;--zloto:#9C7C33;
  --kamien:#E9EAE5;--szept:#5B6070;--linia:rgba(20,23,42,.16);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--kamien);
  color:var(--atrament);font-family:"IBM Plex Sans",system-ui,sans-serif;padding:24px;text-align:center}
.rubryka{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--minia);font-weight:500}
h1{font-family:"Cardo",Georgia,serif;font-weight:400;font-size:clamp(2rem,5vw,3.2rem);
  line-height:1.1;margin:20px 0 16px;max-width:16ch}
h1 em{font-style:italic;color:var(--lazur)}
p{max-width:46ch;color:#2C3145;font-size:1.05rem;margin:0 auto 30px}
.znak{position:fixed;top:26px;left:24px;font-family:"Cardo",serif;font-size:1.1rem;text-decoration:none;color:var(--atrament)}
.znak i{font-style:italic;color:var(--zloto)}
.btn{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  text-decoration:none;padding:14px 26px;border:1px solid var(--atrament);background:var(--atrament);
  color:var(--kamien);transition:background .2s,border-color .2s}
.btn:hover{background:var(--lazur);border-color:var(--lazur)}
.kreska{width:52px;height:1px;background:var(--zloto);margin:0 auto 30px}
</style>
</head>
<body>
<a class="znak" href="/">Fundacja <i>Świętej Jadwigi</i></a>
<main>
  <p class="rubryka">Wiadomość wysłana</p>
  <h1>Dziękujemy — <em>odpiszemy wkrótce</em></h1>
  <div class="kreska"></div>
  <p>Odpowiadamy zwykle w ciągu dwóch dni roboczych. Jeśli sprawa jest pilna, zadzwoń: 577 527 677 lub 515 900 812.</p>
  <a class="btn" href="/">Wróć na stronę główną</a>
</main>
</body>
</html>
